# Postavi Spravaren (Messenger + Tor) z originalneho Messenger APK.
#
# Spustenie: Actions -> "Build Spravaren APK" -> Run workflow -> vloz odkaz na originalne
# APK (napr. z litterbox.catbox.moe). Hotove APK je v artifacte behu (drzi sa 1 den).
#
# Potrebne secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_B64   base64 podpisoveho kluca  (base64 -w0 spravaren.keystore)
#   SIGNING_KEYSTORE_PASS  heslo ku klucu
#   SIGNING_KEY_ALIAS      alias (volitelne, default spravaren)
#
# POZOR: vo VEREJNOM repe si artifact moze stiahnut ktokolvek prihlaseny na GitHube.
name: Build Spravaren APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Priamy odkaz na ORIGINALNE Messenger APK (podpis Facebooku sa overi)"
        required: true
        type: string

permissions:
  contents: read

env:
  NDK_VERSION: "27.3.13750724"   # r27d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # branding.py prefarbuje ikonku cez Pillow
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow

      # najnovsie NDK na runneri (r30) lwip v hev neskompiluje -> pevne r27d
      - name: NDK r27d
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ls "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build"

      - name: Stiahni originalne APK a kluc
        env:
          APK_URL: ${{ inputs.apk_url }}
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          [ -n "$KS_B64" ] || { echo "Chyba secret SIGNING_KEYSTORE_B64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/in"
          curl -sSfL -o "$RUNNER_TEMP/in/messenger.apk" "$APK_URL"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/in/spravaren.keystore"
          ls -la "$RUNNER_TEMP/in"

      - name: Build
        env:
          IN_APK: ${{ runner.temp }}/in/messenger.apk
          KEYSTORE: ${{ runner.temp }}/in/spravaren.keystore
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'spravaren' }}
          OUT_APK: ${{ runner.temp }}/out/spravaren-tor-signed.apk
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          export ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash tor-inject/build-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: spravaren-apk
          path: ${{ runner.temp }}/out/spravaren-tor-signed.apk
          retention-days: 1
          compression-level: 0

      - name: Uprac kluc
        if: always()
        run: rm -f "$RUNNER_TEMP/in/spravaren.keystore"
